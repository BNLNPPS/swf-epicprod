# The pilot pod of BNL_ePIC_GOOGLE_es (docs/GKE_PILOT_FLOW.md): one
# Kubernetes Job, one pod, one pilot pulling work from the queue. The
# cycle (swf_epicprod/gke_pilots.py) sets the name, labels, resources,
# proxy and command. The cluster values were read from cluster
# epic-panda-us-east4 on 2026-10-01: the spot node pool, and CVMFS as the
# cvmfs-nodeplugin daemonset mounts it on every node
# (/var/lib/cvmfs-k8s). The image is the grid image the PanDA team's
# Harvester pods ran (AlmaLinux 9, apptainer, uid 1000; their pilot
# logs). A value left as __SET_FROM_CLUSTER__ stops the cycle.
apiVersion: batch/v1
kind: Job
metadata:
  name: epicprod-pilot
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: epic-main-16-20gb
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # The image has no account for uid 1000, and apptainer (the payload's
      # containers) refuses to start without one: the image's passwd and
      # group plus the pilot's account, mounted over its own.
      initContainers:
        - name: account
          image: atlasadc/atlas-grid-almalinux9
          command: ['/bin/bash', '-c']
          args:
            - >-
              cp /etc/passwd /etc/group /account/ &&
              echo 'epicprod:x:1000:1000:epicprod pilot:/pilotdir:/bin/bash' >> /account/passwd &&
              echo 'epicprod:x:1000:' >> /account/group
          volumeMounts:
            - name: account
              mountPath: /account
      containers:
        - name: pilot
          image: atlasadc/atlas-grid-almalinux9
          workingDir: /pilotdir
          env:
            - name: X509_USER_PROXY
              value: /pilotdir/x509up
            - name: PILOT_NOKILL
              value: "True"
            - name: TMPDIR
              value: /pilotdir
            - name: HOME
              value: /pilotdir
            # The account's name, which getpass.getuser() (the Rucio
            # client's token path) reads before passwd.
            - name: USER
              value: epicprod
            - name: LOGNAME
              value: epicprod
          volumeMounts:
            - name: cvmfs
              mountPath: /cvmfs
              mountPropagation: HostToContainer
              readOnly: true
            - name: proxy
              mountPath: /proxy
              readOnly: true
            - name: pilotdir
              mountPath: /pilotdir
            - name: account
              mountPath: /etc/passwd
              subPath: passwd
              readOnly: true
            - name: account
              mountPath: /etc/group
              subPath: group
              readOnly: true
      volumes:
        - name: account
          emptyDir: {}
        - name: cvmfs
          hostPath:
            path: /var/lib/cvmfs-k8s
            type: Directory
        - name: proxy
          secret:
            secretName: epicprod-pilot-proxy
            defaultMode: 0440
        - name: pilotdir
          emptyDir: {}
